apiVersion: apps/v1
kind: Deployment
metadata:
  name: aegis-controller
  namespace: aegis-system
spec:
  # Two replicas for availability; leader election makes only one of them
  # remediate at a time, and the standby takes over within ~15s.
  replicas: 2
  selector:
    matchLabels:
      app: aegis-controller
  template:
    metadata:
      labels:
        app: aegis-controller
    spec:
      serviceAccountName: aegis-controller
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: aegis-controller
          image: aegis-controller:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: AEGIS_NAMESPACE
              value: aegis-workloads
            - name: AEGIS_MAX_RESTARTS
              value: "5"
            - name: AEGIS_PENDING_TIMEOUT
              value: 5m
            - name: AEGIS_LEADER_ELECTION
              value: "true"
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          ports:
            - name: metrics
              containerPort: 8080
          livenessProbe:
            httpGet:
              path: /healthz
              port: metrics
            initialDelaySeconds: 5
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /healthz
              port: metrics
            periodSeconds: 10
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: aegis-controller-metrics
  namespace: aegis-system
  labels:
    app: aegis-controller
spec:
  selector:
    app: aegis-controller
  ports:
    - name: metrics
      port: 8080
      targetPort: 8080
