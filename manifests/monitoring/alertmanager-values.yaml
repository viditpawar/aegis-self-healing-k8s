alertmanager:
  config:
    global:
      resolve_timeout: 5m
    route:
      receiver: "null"
      group_by: ["alertname"]
      group_wait: 10s
      group_interval: 5m
      repeat_interval: 3h
      routes:
        - receiver: discord
          matchers:
            - alertname = "PodCrashLooping"
    receivers:
      - name: "null"
      - name: discord
        webhook_configs:
          - url: http://alertmanager-discord.aegis-system.svc.cluster.local:9094
            send_resolved: true
