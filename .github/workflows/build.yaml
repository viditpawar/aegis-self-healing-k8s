name: Build and Push Controller

on:
  push:
    branches: [main]
    paths:
      - 'controller/**'
      - 'manifests/**'
      - 'tests/**'
      - 'scripts/**'
      - '.github/workflows/build.yaml'
  pull_request:
    paths:
      - 'controller/**'
      - 'manifests/**'
      - 'tests/**'
      - 'scripts/**'
      - '.github/workflows/build.yaml'

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: controller
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: controller/go.mod
          cache-dependency-path: controller/go.sum

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"; echo "$unformatted"; exit 1
          fi

      - name: Verify go.mod is tidy
        run: go mod tidy && git diff --exit-code go.mod go.sum

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race ./...

  manifests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: controller/go.mod
          cache-dependency-path: controller/go.sum

      # Strict schema validation, including the Argo Rollouts and Prometheus
      # Operator CRDs. alertmanager-values.yaml is Helm values, not a manifest.
      - name: Validate manifests (kubeconform)
        run: |
          go run github.com/yannh/kubeconform/cmd/kubeconform@v0.6.7 \
            -strict -summary \
            -ignore-filename-pattern 'alertmanager-values' \
            -schema-location default \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
            manifests

      - name: Extract alert rules from the PrometheusRule
        run: yq '.spec' manifests/prometheus-rules.yaml > tests/prometheus/rules.generated.yaml

      - name: Check and unit test alert rules (promtool)
        run: |
          docker run --rm -v "$PWD/tests/prometheus:/w" -w /w --entrypoint promtool \
            prom/prometheus:v3.5.0 check rules rules.generated.yaml
          docker run --rm -v "$PWD/tests/prometheus:/w" -w /w --entrypoint promtool \
            prom/prometheus:v3.5.0 test rules rules.test.yaml

      - name: Validate Grafana dashboard JSON
        run: yq '.data["aegis-controller-dashboard.json"]' manifests/monitoring/grafana-dashboard.yaml | jq empty

      - name: Parse PowerShell scripts
        shell: pwsh
        run: |
          foreach ($f in Get-ChildItem scripts -Filter *.ps1) {
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($f.FullName, [ref]$null, [ref]$errors)
            if ($errors) { $errors; throw "$($f.Name) has syntax errors" }
            "$($f.Name) parses OK"
          }

  build:
    needs: [test, manifests]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # PRs only prove the image builds; pushes to main publish it.
      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: ./controller
          push: ${{ github.event_name == 'push' }}
          tags: |
            ghcr.io/viditpawar/aegis-self-healing-k8s-controller:latest
            ghcr.io/viditpawar/aegis-self-healing-k8s-controller:sha-${{ github.sha }}
